<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="The Momentum Intelligence Trading Desk">
  <title>The Momentum Intelligence Trading Desk</title>
  <!--
    THE MARK NEEDS SOMETHING TO STAND ON. Alone it floats; the panel is the
    desk ground (the panel colour from globals.css), and it is why this is the
    icon rather than the bare mark on white. App icon, favicon, avatar,
    consent screen.

    The mark occupies 66 percent of the square, which leaves the optical margin
    a rounded container needs. A mark set to the full box reads cramped at 32px
    even when the geometry says it fits.
  -->
  <rect width="512" height="512" rx="114" fill="#0c0f14"/>
  <g transform="translate(87 87) scale(5.28)">
    <polyline points="9,52 21,19 32,34 43,10 55,52"
              fill="none" stroke="#4d93ff" stroke-width="8"
              stroke-linejoin="miter" stroke-miterlimit="3"/>
  </g>
</svg>
