#
# Direct HTTPS on the instance's own static IP.
#
# Installed at /etc/nginx/sites-available/mointel-tls by setup-tls.sh, which
# substitutes __DOMAIN__ for the sslip.io hostname of the static IP.
#
# This exists because the CloudFront path is not reachable from everywhere. A
# client that cannot complete a CloudFront request — a corporate proxy, a
# resolver, an automated fetcher that gives up on the first edge error — needs
# a route that involves nobody but this server. The hostname is a DNS wildcard
# service that answers with the IP encoded in the name, so the certificate is
# an ordinary publicly-trusted Let's Encrypt certificate for a real name, not a
# self-signed one for an address.
#
# It serves the SAME application through the SAME Nginx. No second process, no
# second worker, no copy of the data. Only another door into the same room, and
# the locks on the far side of it are identical: nginx-locations.conf is shared
# with the :80 server, so /  needs the password here exactly as it does there,
# and /review/<token> is the only thing that does not.
#

server {
    # `listen ... http2` rather than the `http2 on;` directive: the latter
    # arrived in nginx 1.25 and Ubuntu 24.04 ships 1.24, where it is not merely
    # ignored — it refuses to load the configuration at all.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # __SERVER_NAMES__ is the cert lineage plus anything in
    # /etc/mointel/tls-extra-names. The certificate PATHS stay on __DOMAIN__
    # because certbot names a lineage after its first -d and renewal keeps that
    # directory even as SANs are added. Separating the two is the whole point:
    # a second name must never move the path a working certificate lives at.
    server_name __SERVER_NAMES__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Mozilla intermediate: TLS 1.2 and 1.3 only. Nothing needs to reach this
    # from a browser old enough to want anything weaker.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    # Compress proxied JSON. The http block's `gzip on` keeps Ubuntu's defaults
    # (gzip_proxied off, gzip_types text/html), so /api/market left raw: ~803 KB
    # a poll, every second. Measured 2026-09-29 on the box: level 4 -> 154 KB
    # (19%) at ~22 ms CPU. TRANSFER ONLY -- it does not touch build time. The
    # body carries no secret values, so BREACH-class exposure is low. His yes,
    # 2026-09-29. deploy.sh re-renders this file on EVERY deploy, so every later
    # release must carry these lines or the deploy removes them.
    # Rollback: delete these lines, `nginx -t`, reload.
    gzip_proxied    any;
    gzip_types      application/json;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary       on;

    access_log /var/log/nginx/mointel-tls.access.log mointel_timed;
    error_log  /var/log/nginx/mointel-tls.error.log;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Deliberately no HSTS. This hostname is a shared public suffix; asserting
    # a policy for it that outlives this deployment would be rude at best.

    include /etc/nginx/mointel-locations.conf;
}
