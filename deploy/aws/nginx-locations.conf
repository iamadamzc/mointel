# THE OTHER TWO ICONS NEXT EMITS AT THE ROOT, AND THEY ARE NOT OPTIONAL HERE.
#
# `app/icon.svg` and `app/apple-icon.png` are served at `/icon.svg` and
# `/apple-icon.png`, as siblings of `/favicon.ico` -- and the landing page
# LINKS ALL THREE in its <head>. Only `/favicon.ico` was exempt, so from the
# moment the brand icons shipped (31131e4) a stranger's browser requested the
# SVG, got 401, and fell back to the .ico. The favicon still looked right,
# which is exactly why this survived a deploy that was checked.
#
# The fallback does not save the Apple one: `apple-touch-icon` has nothing to
# fall back to, so an iOS home-screen bookmark got no icon at all.
#
# Exact-match, like the four before it. A prefix or a regex over image
# extensions would exempt anything under `/` that happened to end in .svg or
# .png, and the whole point of this file is that the public list is a list.
location = /icon.svg {
    auth_basic off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

location = /apple-icon.png {
    auth_basic off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

# Stripe's webhook (Billing's draft, docs/billing/2026-10-17-billing-interface.md).
# No session: the app verifies Stripe's signature on the raw body before reading
# anything, and answers 400 without one (app/api/billing/webhook/route.ts). Exact
# match, POST only, and a body ceiling; everything else about it is /api/.
# Request buffering changes when nginx forwards the bytes, never the bytes, so it
# cannot break the signature. No `auth_basic off`: there is no server-level
# password since A5, and the grep that guards that must keep returning 0.
location = /api/billing/webhook {
    limit_except POST { deny all; }
    client_max_body_size 1m;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_cache off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
}

# The API is the live state of a trading desk. Every route already sets
# `Cache-Control: no-store`; this says the same thing at the edge, where a
# single cached /api/market would freeze the board for as long as it lived.
location /api/ {
    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

location / {
    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    # Emptied so the upstream keepalive pool is actually used; "close" would
    # tear the connection down after every poll.
    proxy_set_header Connection        "";

    # Next.js streams server-rendered HTML. Buffering it would hold the whole
    # response back and turn a progressive render into a pause.
    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    # Longer than any dashboard poll, short enough that a wedged upstream
    # surfaces as an error rather than as a spinner.
    proxy_read_timeout    120s;
}
