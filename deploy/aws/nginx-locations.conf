#
# Everything the desk serves, shared by both listeners.
#
# Installed at /etc/nginx/mointel-locations.conf and included from the :80
# server (the CloudFront origin) and the :443 server (the direct sslip.io
# hostname) alike.
#
# It is one file on purpose. Two listeners with two hand-maintained copies of
# these rules is how a review path ends up authenticated on one port and a
# password ends up optional on the other — the kind of drift nobody notices
# until it matters.
#

# NO SERVER-LEVEL BASIC AUTH (A5, the beta launch, removed on his instruction
# 2026-10-07). The app is the gate: /desk sends an anonymous visitor to /signin
# and an unaccepted one to /enter; every /api route checks the session (or, for
# /api/dashboard, the box's internal token); /review and /mcp check their
# tokens. The `auth_basic off` lines below are now no-ops, kept so that putting
# the two lines back restores the old wall exactly. A release that still
# carries those two lines re-locks the site: see docs/ops-opening-prompt.md,
# "Hard constraints in force".

# ACME HTTP-01 lives outside the password, or the certificate can never be
# renewed: Let's Encrypt does not authenticate, and a 401 to its validator
# reads as a failed challenge. Nothing else is served from this root.
location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /var/www/certbot;
    default_type "text/plain";
}

# Server-side checks — the deploy script, a post-reboot probe — ask the desk
# whether it is genuinely well, over an interface nothing outside this machine
# can reach. With no password configured (A5), `satisfy any` has only the
# address rule to satisfy: loopback reads it, anyone outside gets 403. Never add
# `auth_basic off` here; every caller is on the box.
location = /api/health {
    satisfy any;
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;
    proxy_read_timeout 30s;
}

# Temporary read-only review sessions.
#
# The ONE place Basic Auth does not apply, and it is safe because the URL is
# itself the credential: a 256-bit capability the application verifies against
# the store on every request, that expires and can be revoked. Nothing under
# /review can write — proxy.ts refuses any method but GET and HEAD before a
# handler sees it.
location /review/ {
    auth_basic off;

    # The token is IN the path, so logging the path logs the credential. An
    # access log is a file that gets copied, shipped and read by people who
    # were never given the link.
    access_log off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

# The MCP endpoint.
#
# Same capability model as /review, and the same reason Basic Auth is off: the
# client holds an unguessable 256-bit token, not a password. Unlike /review this
# one must accept POST — MCP carries every JSON-RPC message that way — so the
# read-only guarantee here comes from the tool registry having no write handler
# to reach, not from the method.
#
# access_log off for the same reason as /review: the token is in the path.
location /mcp/ {
    auth_basic off;
    access_log off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    # A tool call reads the store and returns; none of them are slow, but a
    # diagnostics call on a cold cache can take a moment.
    proxy_read_timeout    120s;
}

# Next.js build assets, and the ONLY unauthenticated path that is not a
# capability URL.
#
# Why it exists: `location /review/` turns Basic Auth off, but Next serves its
# JavaScript and CSS from `/_next/static/*`, which falls under `location /` and
# inherited the server-level `auth_basic` above. So a review session received
# the server-rendered HTML and nothing else — no hydration, no styles, and no
# click did anything. Not one control on the desk has been exercisable through
# a review link since Phase 1; nobody knew, because nobody had clicked one.
#
# Why it is safe to open, checked rather than assumed on 2026-08-23:
#
#   - The project defines ZERO `NEXT_PUBLIC_*` variables, so Next has inlined no
#     environment value into the client bundle. That is the usual way a secret
#     reaches a public bundle and it does not apply here.
#   - All 9 chunks (716K) scan clean of credential, private-key,
#     service-account, Alpaca, OpenAI, CloudFront and instance-IP patterns.
#   - No market data is here. Every byte of desk state comes from `/api/`, which
#     keeps Basic Auth, as does `/` and every other `/_next/` path — `_next/image`
#     and `_next/data` are deliberately NOT covered by this block.
#
# What it does expose: the compiled UI logic and its labels, to someone who
# already holds a chunk URL. Filenames are content-hashed, so they are only
# discoverable from HTML that is itself behind Basic Auth or behind a review
# token — this does not hand the bundle to a scanner that knows only the
# hostname. The honest residue is that a past review-link holder keeps these
# specific URLs working after the token expires, until the next deploy rotates
# the hashes.
#
# `^~` so this wins over any regex location rather than depending on order.
location ^~ /_next/static/ {
    auth_basic off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

# THE PUBLIC SITE: four exact-match exemptions, one batch, 2026-09-16.
#
# Google's OAuth verification needs a publicly reachable home page that
# describes the app and links to a privacy policy and terms, all on the
# verified domain. That is `/`, `/privacy`, `/terms` -- and the tab icon, which
# otherwise 401s on a public page and is invisible from every browser here.
#
# EXACT MATCH (`=`), NOT PREFIX. `^~ /privacy` would also match `/privacy-x`
# and `/privacyexport`, so any future path merely starting with those letters
# would be born public. `=` cannot do that. The board lives at `/desk`, which
# is NOT here and is gated by the app (no server-level auth_basic since A5); `/signin` and
# `/auth/` are deliberately NOT here either -- they arrive with in-app auth.
#
# Proof, from an actor with no cached state (docs/web/2026-09-15-route-spec.md
# §2, read at HEAD): /, /privacy, /terms, /favicon.ico -> 200; and the
# negative control FIRST: /desk -> 401, /signin -> 401, /api/market -> 401,
# /privacy-x -> 401. Four 200s prove the holes exist; only the 401s prove they
# are holes rather than a missing wall.
#
# `/` is the landing page, static, no session, no cookie. It must EXIST before
# this block lands (it does, from release 1c23322); a `= /` exemption with no
# page behind it is a public 404 that burns a verification attempt.
location = / {
    auth_basic off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

location = /privacy {
    auth_basic off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

location = /terms {
    auth_basic off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

# The float explainer page (Web's app/are-float-quotes-real/page.tsx), public
# like /privacy and /terms. His path approval 2026-10-06T00:41:47Z; it ships in
# the same release as the page, so the hole never opens onto a 404. EXACT MATCH
# for the reason given above: `^~` would make /are-float-quotes-real-x public.
# The app does not gate this page (its gate is opt-in per page and proxy.ts
# matches /review/ only), so this line is the only wall in front of it.
# Proof after the ship, negative control first: /desk and
# /are-float-quotes-real-x -> 401 without credentials; then this path -> 200.
location = /are-float-quotes-real {
    auth_basic off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

# robots.txt: served by Next (app/robots.ts), allow-all, two lines. His "yes"
# to indexing, 2026-09-17. Before this an absent-but-401 robots file was an
# ERROR crawlers read inconsistently. The file names no private path; the
# private paths are protected by the 401 the server default gives them.
location = /robots.txt {
    auth_basic off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

