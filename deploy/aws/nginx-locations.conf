#
# Everything the desk serves, shared by both listeners.
#
# Installed at /etc/nginx/mointel-locations.conf and included from the :80
# server (the CloudFront origin) and the :443 server (the direct sslip.io
# hostname) alike.
#
# It is one file on purpose. Two listeners with two hand-maintained copies of
# these rules is how a review path ends up authenticated on one port and a
# password ends up optional on the other — the kind of drift nobody notices
# until it matters.
#

auth_basic           "Momentum Intelligence Trading Desk";
auth_basic_user_file /etc/nginx/mointel.htpasswd;

# ACME HTTP-01 lives outside the password, or the certificate can never be
# renewed: Let's Encrypt does not authenticate, and a 401 to its validator
# reads as a failed challenge. Nothing else is served from this root.
location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /var/www/certbot;
    default_type "text/plain";
}

# Server-side checks — the deploy script, a post-reboot probe — ask the desk
# whether it is genuinely well, over an interface nothing outside this machine
# can reach. Anyone arriving from outside still has to authenticate: `satisfy
# any` grants access on either the address or the password.
location = /api/health {
    satisfy any;
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;
    proxy_read_timeout 30s;
}

# Temporary read-only review sessions.
#
# The ONE place Basic Auth does not apply, and it is safe because the URL is
# itself the credential: a 256-bit capability the application verifies against
# the store on every request, that expires and can be revoked. Nothing under
# /review can write — proxy.ts refuses any method but GET and HEAD before a
# handler sees it.
location /review/ {
    auth_basic off;

    # The token is IN the path, so logging the path logs the credential. An
    # access log is a file that gets copied, shipped and read by people who
    # were never given the link.
    access_log off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

# The MCP endpoint.
#
# Same capability model as /review, and the same reason Basic Auth is off: the
# client holds an unguessable 256-bit token, not a password. Unlike /review this
# one must accept POST — MCP carries every JSON-RPC message that way — so the
# read-only guarantee here comes from the tool registry having no write handler
# to reach, not from the method.
#
# access_log off for the same reason as /review: the token is in the path.
location /mcp/ {
    auth_basic off;
    access_log off;

    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    # A tool call reads the store and returns; none of them are slow, but a
    # diagnostics call on a cold cache can take a moment.
    proxy_read_timeout    120s;
}

# The API is the live state of a trading desk. Every route already sets
# `Cache-Control: no-store`; this says the same thing at the edge, where a
# single cached /api/market would freeze the board for as long as it lived.
location /api/ {
    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    proxy_set_header Connection        "";

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
}

location / {
    proxy_pass http://mointel_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
    # Emptied so the upstream keepalive pool is actually used; "close" would
    # tear the connection down after every poll.
    proxy_set_header Connection        "";

    # Next.js streams server-rendered HTML. Buffering it would hold the whole
    # response back and turn a progressive render into a pause.
    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    # Longer than any dashboard poll, short enough that a wedged upstream
    # surfaces as an error rather than as a spinner.
    proxy_read_timeout    120s;
}
