#
# Origin web server for the Momentum Intelligence Trading Desk.
#
# Installed at /etc/nginx/sites-available/mointel and symlinked into
# sites-enabled by deploy/aws/deploy.sh.
#
# Two jobs, and only two: put a password in front of a desk that used to be
# private by virtue of running on localhost, and hand everything else to the
# Next.js server on 127.0.0.1:3000 without changing it. Next.js is never
# exposed directly — the Lightsail firewall does not open 3000, and this server
# is the only thing that talks to it.
#

upstream mointel_app {
    server 127.0.0.1:3000;
    # A pool of idle connections, so a dashboard polling once a second is not
    # paying for a new TCP handshake every time.
    keepalive 16;
}

# The distribution terminates TLS and tells us so. A request that arrives over
# the loopback interface carries no such header, and would otherwise forward an
# empty one.
map $http_x_forwarded_proto $mointel_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The desk sends small requests and receives JSON. A large body is either a
    # mistake or an attack.
    client_max_body_size 1m;

    access_log /var/log/nginx/mointel.access.log;
    error_log  /var/log/nginx/mointel.error.log;

    # Nothing here is meant to be framed, sniffed or referred onward.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    auth_basic           "Momentum Intelligence Trading Desk";
    auth_basic_user_file /etc/nginx/mointel.htpasswd;

    # Server-side checks — the deploy script, a post-reboot probe — ask the desk
    # whether it is genuinely well, over an interface nothing outside this
    # machine can reach. Anyone arriving through the distribution still has to
    # authenticate: `satisfy any` grants access on either the address or the
    # password, and a CloudFront edge is not 127.0.0.1.
    location = /api/health {
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        proxy_pass http://mointel_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # The API is the live state of a trading desk. Every route already sets
    # `Cache-Control: no-store`; this says the same thing at the edge, where a
    # single cached /api/market would freeze the board for as long as it lived.
    location /api/ {
        proxy_pass http://mointel_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    location / {
        proxy_pass http://mointel_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
        # Emptied so the keepalive pool above is actually used; "close" would
        # tear the upstream connection down after every poll.
        proxy_set_header Connection        "";

        # Next.js streams server-rendered HTML. Buffering it would hold the
        # whole response back and turn a progressive render into a pause.
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # Longer than any dashboard poll, short enough that a wedged upstream
        # surfaces as an error rather than as a spinner.
        proxy_read_timeout    120s;
    }
}
