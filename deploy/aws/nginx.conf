#
# Origin web server for the Momentum Intelligence Trading Desk.
#
# Installed at /etc/nginx/sites-available/mointel and symlinked into
# sites-enabled by deploy/aws/deploy.sh.
#
# This file owns the http-level pieces and the :80 listener. The :443 listener
# lives in nginx-tls.conf, installed separately once a certificate exists, and
# both include the SAME location file — see nginx-locations.conf for why.
#
# Port 80 stays plain HTTP and is NOT redirected to HTTPS. That is deliberate:
# the Lightsail distribution reaches this origin over http-only, so a blanket
# redirect here would break the CloudFront path entirely.
#

upstream mointel_app {
    server 127.0.0.1:3000;
    # A pool of idle connections, so a dashboard polling once a second is not
    # paying for a new TCP handshake every time.
    keepalive 16;
}

# The distribution terminates TLS and tells us so. A request that arrives over
# the loopback interface carries no such header, and would otherwise forward an
# empty one.
map $http_x_forwarded_proto $mointel_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# nginx's built-in "combined" fields, in the same order, with two timings
# appended: $request_time (seconds, first client byte to last byte sent) and
# $upstream_response_time (seconds the app took; "-" when no upstream was
# called). Appended at the END so anything that reads combined still reads
# every line. Why: the box recorded no request times, so whether a synchronous
# /api/market build stalls the board in the 07:00-10:00 ET window could only be
# answered by probing the live server, which adds the load it measures. With
# this, the log answers it. Defined here, at http level, because this file
# owns the http-level pieces and sites-enabled/mointel loads before
# sites-enabled/mointel-tls, which uses the same name.
log_format mointel_timed '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" $request_time $upstream_response_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The desk sends small requests and receives JSON. A large body is either a
    # mistake or an attack.
    client_max_body_size 1m;

    access_log /var/log/nginx/mointel.access.log mointel_timed;
    error_log  /var/log/nginx/mointel.error.log;

    # Nothing here is meant to be framed, sniffed or referred onward.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # THIS SERVER REDIRECTS. IT DOES NOT SERVE THE DESK.
    #
    # It used to include mointel-locations.conf, which meant :80 offered the
    # SAME Basic Auth challenge as :443. A browser that answered it sent the
    # desk password base64-encoded over plaintext HTTP -- base64 is an
    # encoding, not a cipher, so anyone on the path reads it. Measured
    # 2026-09-10: `http://` returned 401 with no redirect, so the insecure
    # path was not merely reachable, it was the one being offered.
    #
    # WHY THE INCLUDE CANNOT SIMPLY STAY ALONGSIDE A REDIRECT. That file sets
    # `auth_basic` at server level and defines its own `location /` proxying
    # to the app. Including it and adding a redirect in `location /` is a
    # duplicate location and nginx refuses to load. So this server defines
    # what it needs and includes nothing.
    #
    # THE ACME BLOCK BELOW IS A SECOND COPY OF THE ONE IN
    # mointel-locations.conf, AND THAT IS DELIBERATE BUT NOT FREE. Changing
    # one and not the other breaks certificate renewal silently -- renewal is
    # attempted by a timer nobody watches, and the failure surfaces as an
    # expired certificate weeks later. If you edit either, edit both. It is
    # four lines; a shared include would have meant a new file plus a new
    # `install` line in deploy.sh on the same night as a schema migration,
    # which is more new machinery than the duplication costs.

    # ACME HTTP-01 arrives on port 80 over plain HTTP by definition and cannot
    # be redirected: Let's Encrypt's validator does not follow to HTTPS for
    # this challenge, and it does not authenticate. `^~` so it wins over the
    # catch-all below rather than depending on order.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    # LOOPBACK HEALTH, AND THE REDIRECT ABOVE IS WHY IT HAS TO BE REPEATED HERE.
    #
    # `deploy.sh` gates on `curl -fsS http://127.0.0.1/api/health`. Without
    # this block that request meets the catch-all below and gets a 301 -- and
    # `curl -f` fails only on 4xx/5xx, so a redirect EXITS 0. The gate passes
    # without ever reaching the application.
    #
    # Measured on 2026-09-11, minutes after the redirect shipped: exit 0,
    # status 301, redirecting to https://127.0.0.1/api/health, while the app
    # itself answered 200. The deploy was healthy and the check proving it was
    # not. A gate that cannot fail is worse than no gate, because it is
    # believed.
    #
    # This is the composition shape again: the redirect is correct on its own
    # -- never offer Basic Auth over cleartext -- and the health endpoint was
    # deliberately built to answer over loopback on :80. Each half right, and
    # the second one broken by the first.
    #
    # `satisfy any` with the loopback allow matches the :443 block exactly, so
    # the two servers agree. From outside this machine `deny all` refuses it.
    location = /api/health {
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        proxy_pass http://mointel_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mointel_forwarded_proto;
        proxy_set_header Connection        "";
    }

    # Everything else. `$host` and not `$server_name`, because `server_name _`
    # would redirect to the literal host `_`.
    #
    # A request to the bare IP now redirects to https://98.85.49.227/, which
    # fails certificate validation -- the cert covers the three DNS names and
    # never covered the address. That is not a regression: reaching the desk
    # by IP only ever "worked" by sending the password in the clear, which is
    # the thing being removed. Use tmitrader.com or the sslip.io name.
    location / {
        return 301 https://$host$request_uri;
    }
}
