#
# Origin web server for the Momentum Intelligence Trading Desk.
#
# Installed at /etc/nginx/sites-available/mointel and symlinked into
# sites-enabled by deploy/aws/deploy.sh.
#
# This file owns the http-level pieces and the :80 listener. The :443 listener
# lives in nginx-tls.conf, installed separately once a certificate exists, and
# both include the SAME location file — see nginx-locations.conf for why.
#
# Port 80 stays plain HTTP and is NOT redirected to HTTPS. That is deliberate:
# the Lightsail distribution reaches this origin over http-only, so a blanket
# redirect here would break the CloudFront path entirely.
#

upstream mointel_app {
    server 127.0.0.1:3000;
    # A pool of idle connections, so a dashboard polling once a second is not
    # paying for a new TCP handshake every time.
    keepalive 16;
}

# The distribution terminates TLS and tells us so. A request that arrives over
# the loopback interface carries no such header, and would otherwise forward an
# empty one.
map $http_x_forwarded_proto $mointel_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The desk sends small requests and receives JSON. A large body is either a
    # mistake or an attack.
    client_max_body_size 1m;

    access_log /var/log/nginx/mointel.access.log;
    error_log  /var/log/nginx/mointel.error.log;

    # Nothing here is meant to be framed, sniffed or referred onward.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    include /etc/nginx/mointel-locations.conf;
}
